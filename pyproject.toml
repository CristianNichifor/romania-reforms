[project]
name = "romania-reforms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "lxml>=5.0",
    "referencing>=0.37.0",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
