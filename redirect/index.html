<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-a mutat — Simulatoare de reformă</title>
    <link rel="canonical" href="https://projects.cristian-nichifor.com/romania-reforms/" />
    <meta name="robots" content="noindex" />
    <!--
      The site moved to projects.cristian-nichifor.com with the same layout under
      /romania-reforms/, so a link keeps working if its path, query and hash survive the move.
      Most simulators keep their scenario in location.hash: dropping it would open the right
      page with someone else's numbers. GitHub Pages serves this same file as 404.html for
      every path it no longer has, which is how a deep link reaches the script at all. The
      meta refresh is the no-JavaScript fallback and can only manage the landing page.
    -->
    <script>
      (function () {
        var target = 'https://projects.cristian-nichifor.com/romania-reforms/';
        var rest = location.pathname.replace(/^\/romania-reforms(?=\/|$)/, '').replace(/^\/+/, '');
        location.replace(target + rest + location.search + location.hash);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://projects.cristian-nichifor.com/romania-reforms/" />
    </noscript>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b0d10;
        color: #e8eaed;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      a {
        color: #7fb3ff;
      }
      p {
        max-width: 32rem;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f8fa;
          color: #14181d;
        }
        a {
          color: #1a5fd0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Simulatoarele s-au mutat</h1>
      <p>
        <strong>Simulatoare de reformă</strong> se află acum pe projects.cristian-nichifor.com.
        Ar trebui să fii redirecționat imediat, cu tot cu scenariul din link.
      </p>
      <p>
        <a href="https://projects.cristian-nichifor.com/romania-reforms/">Deschide simulatoarele</a>
      </p>
    </main>
  </body>
</html>
