name: CI
on: [push, pull_request]
permissions:
  contents: read

# One job per simulator, run in parallel rather than filtered by path. Filtering would save
# a few minutes and cost a dependency and a class of mistake — a shared package changing
# under a simulator whose job was skipped. The whole matrix is under five minutes.

jobs:
  shared:
    name: shared (schemas + provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Repository size
        run: uv run python scripts/check_repo_size.py
      - name: Fetch release data
        run: >-
          uv run python scripts/fetch_release_data.py
          --require local-finance-mart-2023-2025
          --require salarizare-ro-draft-2026-07-16
          --require public-enterprise-administrative-footprint-2024-2026
      - name: Validate every simulator's data against its schema
        run: uv run --with referencing python scripts/validate_data.py
      - name: Pay grades and costs are reproducible
        run: |
          uv run python simulators/justitie/scripts/import_indemnizatii.py
          uv run --with pypdf python simulators/justitie/scripts/import_pensii.py
          uv run python simulators/justitie/scripts/build_costuri.py
          git diff --exit-code simulators/justitie/data/
      - name: The arondare is reproducible
        run: |
          uv run --with pypdf python simulators/justitie/scripts/import_arondare.py
          git diff --exit-code simulators/justitie/data/arondare-2023.json
      - name: Court locations are reproducible
        run: |
          for year in 2023 2025; do
            uv run python simulators/justitie/scripts/locate_instante.py --year "$year"
          done
          git diff --exit-code simulators/justitie/data/
      - name: Declare separate full-data scope
        run: |
          echo '### Shared bounded verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'The following real-source assertions are NOT certified by this PR check; use full-data.yml.' >> "$GITHUB_STEP_SUMMARY"
          uv run --with geopandas python -m pytest tests/ --collect-only -q -m full_data >> "$GITHUB_STEP_SUMMARY"
      - name: Tests
        run: uv run --with referencing --with geopandas python -m pytest tests/ -q -m "not full_data" --junitxml=reports/shared.xml
      - name: Require executed test evidence
        if: ${{ !cancelled() }}
        run: python scripts/check_test_report.py reports/shared.xml

  salarizare:
    name: salarizare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulators/salarizare
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch release data
        run: uv run python ../../scripts/fetch_release_data.py --require salarizare-ro-draft-2026-07-16
      - name: Validate every regime, crosswalk and fiscal series
        run: uv run --with jsonschema python scripts/validate_data.py
      - name: Importer tests
        run: uv run --with openpyxl --with pytest --with jsonschema pytest tests/ -q --junitxml=reports/importers.xml
      - name: Require executed importer evidence
        if: ${{ !cancelled() }}
        run: python ../../scripts/check_test_report.py reports/importers.xml
      - name: Import is reproducible
        run: |
          sha256sum data/regimes/ro-draft-2026-07-16.json > "$RUNNER_TEMP/salary-july.sha256"
          uv run --with openpyxl python scripts/import_coeficienti.py
          sha256sum --check "$RUNNER_TEMP/salary-july.sha256"
      - name: Engine
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Pay app and shared-control browser checks
        working-directory: simulators/salarizare/app
        run: |
          npm ci --ignore-scripts
          npm run build
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/work" -v /tmp:/tmp -w /work/simulators/salarizare/app mcr.microsoft.com/playwright:v1.63.0-noble npm run check:ui
      - name: Upload pay browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pay-browser-checks
          path: /tmp/pay-civic-ui-*
          if-no-files-found: error
          retention-days: 7

  justitie:
    name: justitie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The app draws a file the pipeline writes, so the pipeline runs first: a typecheck
      # against a missing court map would pass and the map would still be empty.
      - name: Locate the courts
        run: uv run python simulators/justitie/scripts/locate_instante.py --year 2025
      - name: App
        working-directory: simulators/justitie/app
        run: |
          npm ci
          npm run build

  administrativ:
    name: administrativ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: simulators/administrativ/web/package-lock.json
      # Bounded pipeline-to-model fixtures run without national processed files. The
      # 50 national assertions remain fail-closed in full-data.yml, not skipped here.
      # The web side separately checks the tracked national parity fixture by hash.
      - name: Declare separate national scope
        working-directory: simulators/administrativ
        run: |
          echo '### National reference assertions outside bounded PR verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'These require the six processed pipeline inputs. Full-data verification fails closed when they are absent.' >> "$GITHUB_STEP_SUMMARY"
          uv run pytest tests/ --collect-only -q -m full_data >> "$GITHUB_STEP_SUMMARY"
      - name: Reference model (bounded fixtures)
        working-directory: simulators/administrativ
        env:
          PYTHONHASHSEED: '0'
        run: |
          uv sync --all-groups
          uv run ruff check pipeline tests
          uv run ruff format --check pipeline tests
          uv run pytest -q -m "not full_data" --junitxml=reports/pipeline.xml
      - name: Web
        working-directory: simulators/administrativ/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Require executed reference-model evidence
        if: ${{ !cancelled() }}
        run: python scripts/check_test_report.py simulators/administrativ/reports/pipeline.xml

  transport:
    name: transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The travel-time build needs administrativ's road graph and a 1 GB OSM extract, so it
      # does not run here — like administration's separate national-data certification. What
      # runs is everything that does not need the artefacts: the speed table, the
      # accumulation, and the gate's own logic.
      #
      # The speed model IS now checked, at both ends and against two references that disagree
      # in opposite directions: 3,7% slow against 552 timetabled county bus runs, ~10% fast
      # against twelve routed car drives in Valcea. Neither is ground truth, so what provenance
      # declares is no longer "unvalidated" but the size and direction of the two gaps.
      #
      # The gate itself still cannot run here — it needs the travel-time artefacts, like the
      # rest of the pipeline. What pytest covers is its logic and that its reference file stays
      # filled, so a placeholder cannot come back and make it verify nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch required speed-limit verification input
        run: uv run python scripts/fetch_release_data.py --require transport-road-speeds
      - name: Pipeline
        working-directory: simulators/transport
        env:
          PYTHONHASHSEED: '0'
        run: |
          uv sync --all-groups
          uv run ruff check scripts tests
          uv run ruff format --check scripts tests
          uv run pytest -q --junitxml=reports/pipeline.xml
      - name: Require executed pipeline evidence
        if: ${{ !cancelled() }}
        run: python scripts/check_test_report.py simulators/transport/reports/pipeline.xml
      # The app joins journey times to polygons by position, and copy-data.mjs fails loudly
      # when that join matches nothing — which is the check worth having in CI, because a
      # silently empty join renders a plausible grey map.
      - name: App
        working-directory: simulators/transport/app
        run: |
          npm ci
          npm run build

  impozit-teren:
    name: impozit-teren
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: simulators/impozit-teren/app/package-lock.json
      - name: Declare source verification boundary
        run: |
          echo '### Bounded land verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rebuilds use committed inputs and recorded exchange rates. Live INS/notary/ECB and national geometry certification remains required before related publication: land-source-verification.yml.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch required browser inputs
        run: uv run python scripts/fetch_release_data.py --require local-finance-mart-2023-2025 --require impozit-teren-uat-map
      - name: Cached source parsers remain reproducible
        run: |
          uv run python simulators/impozit-teren/scripts/import_pret_cerut.py
          uv run python simulators/impozit-teren/scripts/import_teren_agricol_ins.py
          uv run python simulators/impozit-teren/scripts/import_cod_fiscal.py
          git diff --exit-code simulators/impozit-teren/data/
      - name: Rebuild every county from committed parsed sources
        run: |
          simulators/impozit-teren/scripts/rebuild.sh --pinned --committed-built-yield
          git diff --exit-code simulators/impozit-teren/data/
      - name: App
        working-directory: simulators/impozit-teren/app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Native UI pilot browser checks
        run: >-
          docker run --rm --init --ipc=host -e CI=1 -e LIBGL_ALWAYS_SOFTWARE=1
          -v "$PWD:/work" -w /work/simulators/impozit-teren/app
          -v "$RUNNER_TEMP/land-tax-ui-results:/tmp/land-tax-ui-results"
          mcr.microsoft.com/playwright:v1.63.0-noble
          xvfb-run -a npm run check:ui -- --reporter=list
      - name: Native UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: land-tax-ui-results
          path: ${{ runner.temp }}/land-tax-ui-results
          if-no-files-found: error
          retention-days: 7

  deconcentrare:
    name: deconcentrare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Pipeline lint
        run: |
          uvx ruff check simulators/deconcentrare
          uvx ruff format --check simulators/deconcentrare
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App
        working-directory: simulators/deconcentrare/app
        run: |
          npm ci
          npm run build

  companii-stat:
    name: companii-stat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Pipeline lint
        run: |
          uvx ruff check simulators/companii-stat
          uvx ruff format --check simulators/companii-stat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App
        working-directory: simulators/companii-stat/app
        run: |
          npm ci
          npm run build

  justice-browser:
    uses: ./.github/workflows/justice-browser.yml

  native-consumers:
    uses: ./.github/workflows/native-consumers.yml

  verify:
    name: verify
    if: ${{ always() }}
    needs: [shared, salarizare, justitie, administrativ, transport, impozit-teren, deconcentrare, companii-stat, justice-browser, native-consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every correctness job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failed = {job: value["result"] for job, value in results.items()
                    if value["result"] != "success"}
          for job, result in failed.items():
              print(f"::error::{job}: {result}")
          sys.exit(1 if failed or not results else 0)
          PYCODE
