name: CI
on: [push, pull_request]

# One job per simulator, run in parallel rather than filtered by path. Filtering would save
# a few minutes and cost a dependency and a class of mistake — a shared package changing
# under a simulator whose job was skipped. The whole matrix is under five minutes.

jobs:
  shared:
    name: shared (schemas + provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Repository size
        run: uv run python scripts/check_repo_size.py
      - name: Validate every simulator's data against its schema
        run: uv run --with referencing python scripts/validate_data.py
      - name: Pay grades and costs are reproducible
        run: |
          uv run python simulators/justitie/scripts/import_indemnizatii.py
          uv run --with pypdf python simulators/justitie/scripts/import_pensii.py
          uv run python simulators/justitie/scripts/build_costuri.py
          git diff --exit-code simulators/justitie/data/
      - name: The arondare is reproducible
        run: |
          uv run --with pypdf python simulators/justitie/scripts/import_arondare.py
          git diff --exit-code simulators/justitie/data/arondare-2023.json
      - name: Court locations are reproducible
        run: |
          for year in 2023 2025; do
            uv run python simulators/justitie/scripts/locate_instante.py --year "$year"
          done
          git diff --exit-code simulators/justitie/data/
      - name: Tests
        run: uv run --with referencing python -m pytest tests/ -q

  salarizare:
    name: salarizare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulators/salarizare
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every regime, crosswalk and fiscal series
        run: uv run --with jsonschema python scripts/validate_data.py
      - name: Importer tests
        run: uv run --with openpyxl --with pytest --with jsonschema pytest tests/ -q
      - name: Import is reproducible
        run: |
          uv run --with openpyxl python scripts/import_coeficienti.py
          git diff --exit-code data/regimes/ro-draft-2026-07-16.json
      - name: Engine
        run: |
          npm ci
          npm run typecheck
          npm test

  justitie:
    name: justitie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The app draws a file the pipeline writes, so the pipeline runs first: a typecheck
      # against a missing court map would pass and the map would still be empty.
      - name: Locate the courts
        run: uv run python simulators/justitie/scripts/locate_instante.py --year 2025
      - name: App
        working-directory: simulators/justitie/app
        run: |
          npm ci
          npm run build

  administrativ:
    name: administrativ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: simulators/administrativ/web/package-lock.json
      # The reference model's own tests need the built pipeline artefacts, which are not in
      # the repository — they skip here, exactly as they did in the standalone repo. What
      # does run in CI is the web side: `web/public/data` *is* tracked, so the parity
      # fixtures compare the TypeScript port against the Python reference by hash, and a
      # single commune out of 3,186 landing in the wrong unit fails the build.
      - name: Reference model (lint; tests skip without built artefacts)
        working-directory: simulators/administrativ
        env:
          PYTHONHASHSEED: '0'
        run: |
          uv sync --all-groups
          uv run ruff check pipeline tests
          uv run ruff format --check pipeline tests
          uv run pytest -q
      - name: Web
        working-directory: simulators/administrativ/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

  transport:
    name: transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The travel-time build needs administrativ's road graph and a 1 GB OSM extract, so it
      # does not run here — the same reason administrativ's reference-model tests skip. What
      # runs is everything that does not need the artefacts: the speed table, the
      # accumulation, and the gate's own logic.
      #
      # The speed model IS now checked, at both ends and against two references that disagree
      # in opposite directions: 3,7% slow against 552 timetabled county bus runs, ~10% fast
      # against twelve routed car drives in Valcea. Neither is ground truth, so what provenance
      # declares is no longer "unvalidated" but the size and direction of the two gaps.
      #
      # The gate itself still cannot run here — it needs the travel-time artefacts, like the
      # rest of the pipeline. What pytest covers is its logic and that its reference file stays
      # filled, so a placeholder cannot come back and make it verify nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pipeline
        working-directory: simulators/transport
        env:
          PYTHONHASHSEED: '0'
        run: |
          uv sync --all-groups
          uv run ruff check scripts tests
          uv run ruff format --check scripts tests
          uv run pytest -q
      # The app joins journey times to polygons by position, and copy-data.mjs fails loudly
      # when that join matches nothing — which is the check worth having in CI, because a
      # silently empty join renders a plausible grey map.
      - name: App
        working-directory: simulators/transport/app
        run: |
          npm ci
          npm run build

  impozit-teren:
    name: impozit-teren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: simulators/impozit-teren/app/package-lock.json
      # Imported before the grids: the register is the roster each grid is checked against,
      # so a grid cannot be verified before its county's areas exist.
      #
      # INS TEMPO is a separate service from unnpr.ro and fails differently: over its cell
      # budget it answers 200 with an empty body rather than an error, so "it ran" is not
      # evidence it worked. The importer's own check — the register's categories against the
      # register's total — is what turns that into a failure.
      - name: The land areas are reproducible
        run: |
          uv run python simulators/impozit-teren/scripts/import_fond_funciar.py --all
          git diff --exit-code simulators/impozit-teren/data/
      - name: The land grids are reproducible
        run: |
          for chamber in bacau neamt alba iasi sibiu constanta tulcea prahova mures harghita \
                         vrancea dambovita buzau hunedoara bistrita maramures salaj \
                         timis cluj bihor satumare vaslui; do
            uv run --with pypdf python simulators/impozit-teren/scripts/import_ghid.py \
              --chamber "$chamber"
          done
          git diff --exit-code simulators/impozit-teren/data/
      # Rebuilt at the rate the committed datasets were built with, not today's. Everything
      # downstream is published in euro and most chambers price in lei, so without pinning the
      # rate this output moves in the fourth significant figure of every locality whenever the
      # euro does — which is not a regression and cannot be told apart from one. Pinned, the
      # diff tests what it was meant to test: the parsing and the arithmetic. The live rate is
      # exercised by the steps below, which are not diffed for exactly this reason.
      - name: The land value is reproducible
        run: |
          for county in AB BC BH BN BZ CJ CT DB HD HR IS MM MS NT PH SB SJ SM TL TM VN VS; do
            uv run python simulators/impozit-teren/scripts/build_valoare_teren.py \
              --county "$county" --reuse-exchange-rate
          done
          git diff --exit-code simulators/impozit-teren/data/
      # The asking-price barometer is someone else's aggregate under CC BY 4.0, so it is
      # cached in sources/ and the importer reads the cache by default. --refresh is what
      # goes back to verifi.ro, and CI does not: a build should not depend on a third party
      # being up, and the comparison is only meaningful against the grid edition beside it.
      #
      # This step must stay ahead of "The comparison runs": build_impozit.py and
      # build_renta.py both read the INS survey for the measured agricultural yield, and
      # without it they fall back to the single assumed band and write different numbers.
      - name: The market comparison is reproducible
        run: |
          uv run python simulators/impozit-teren/scripts/import_pret_cerut.py
          uv run python simulators/impozit-teren/scripts/import_teren_agricol_ins.py
          uv run python simulators/impozit-teren/scripts/import_lemn_recoltat.py
          uv run python simulators/impozit-teren/scripts/build_multiplu_piata.py
          uv run python simulators/impozit-teren/scripts/build_randament_construit.py
          uv run python simulators/impozit-teren/scripts/build_randament_padure.py
          git diff --exit-code simulators/impozit-teren/data/
      # The Fiscal Code's tables change: two of the five were replaced with effect from
      # 1 January 2026. Re-reading them on every run is how that gets noticed, and the
      # importer refuses to write a table whose shape no longer matches the article.
      - name: The Fiscal Code tables are reproducible
        run: |
          uv run python simulators/impozit-teren/scripts/import_cod_fiscal.py
          git diff --exit-code simulators/impozit-teren/data/cod-fiscal-teren-2026.json
      # Not diffed: the comparison carries the day's ECB reference rate, so it changes when
      # the euro does and a byte-identical rerun would only prove the cache was warm. The
      # tests check the claim instead of the bytes.
      - name: The comparison runs
        run: |
          for county in AB BC BH BN BZ CJ CT DB HD HR IS MM MS NT PH SB SJ SM TL TM VN VS; do
            uv run python simulators/impozit-teren/scripts/build_impozit.py --county "$county"
            uv run python simulators/impozit-teren/scripts/build_renta.py --county "$county"
          done
      # The page redoes both taxes in the browser as the reader moves the assumptions, so it
      # is a second implementation of the two builders. `npm test` is the parity check
      # between them: at the Python's own settings the two must agree to the rounding, or the
      # page keeps rendering confident numbers that no longer match the files behind them.
      # The map borrows administrativ's boundaries rather than fetching a second copy, so it
      # only builds where that pipeline's output exists. Not diffed: geopandas versions move
      # the last decimal of a simplified vertex, and a byte-identical polygon is not the claim.
      # The national estimate closes the half of the country no chamber publishes. It has to
      # run after every county's value is built, because it is fitted on them — and after the
      # population import, because the fit's only predictor is the size of the county seat.
      # Not diffed: it consumes the tax files, which carry the day's ECB rate.
      - name: The national estimate runs
        run: |
          uv run python simulators/impozit-teren/scripts/import_populatie.py --all
          uv run python simulators/impozit-teren/scripts/build_valoare_nationala.py
      - name: The map's shapes build
        run: |
          uv run --with geopandas python simulators/impozit-teren/scripts/build_harta.py
      - name: App
        working-directory: simulators/impozit-teren/app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
