name: Deploy to GitHub Pages

# The site is built and published by deploy-pages-cloudflare.yml and served at
# https://projects.cristian-nichifor.com/romania-reforms/. What GitHub Pages publishes now is
# the redirect in redirect/: the same page as index.html and as 404.html, so every old
# cristiannichifor.github.io/romania-reforms/<path>?<query>#<hash> link lands on the same path,
# query and scenario hash at the new address. Nothing here builds the simulators any more.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A redirect that points at nothing is worse than no redirect: it turns a working link
      # into a loop through a 404. Checked here so the stub cannot go live before the site it
      # forwards to.
      - name: Check the destination is live
        run: |
          url=https://projects.cristian-nichifor.com/romania-reforms/
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "destination is not serving; refusing to publish the redirect"; exit 1; }

      - name: Check the redirect keeps path, query and hash
        run: node --test tests/redirect.test.cjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
