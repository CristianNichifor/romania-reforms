<!--
  Mirrored into each app's public/ so the icon works in dev, in preview and in the deployed
  site without a copy step to forget. CI checks the four copies are identical.

  Ascending bars in the flag's blue, yellow and red: a chart and a country at once. No
  background plate — a dark one disappeared into a dark tab strip, and these three colours
  carry themselves on either. Bars are seven units wide of thirty-two because at sixteen
  pixels anything thinner than about a third of that closes up into a smear.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Simulatoare de reformă">
  <rect x="2.5" y="17" width="7" height="12" rx="1.5" fill="#3b82f6" />
  <rect x="12.5" y="10" width="7" height="19" rx="1.5" fill="#fcd116" />
  <rect x="22.5" y="3" width="7" height="26" rx="1.5" fill="#e5484d" />
</svg>
